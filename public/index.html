<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LeanLLM — a focused chat interface for local Ollama models.">
  <meta name="theme-color" content="#292524">
  <title>LeanLLM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231c1917'/><path d='M30 24h11v41h28v11H30Z' fill='%23fafaf9'/></svg>">
  <link rel="stylesheet" href="/assets/index.css?v=20260915">
  <script>
    const stored = localStorage.getItem('leanllm.theme');
    const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  </script>
</head>
<body>
  <div id="app">
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <a class="brand" href="/">
          <span class="brand-mark">L</span>
          <span>LeanLLM</span>
        </a>
        <button id="close-sidebar" class="icon-button sidebar-close" title="Close sidebar" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <button id="new-chat" class="new-chat">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>New chat</span>
      </button>

      <div class="conversation-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="conversation-filter" type="search" placeholder="Search chats" autocomplete="off">
      </div>

      <nav id="conversation-list" class="conversation-list" aria-label="Conversations"></nav>

      <div class="sidebar-footer">
        <button id="theme-toggle" class="ghost-item">
          <svg id="theme-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
          <span id="theme-label">Light mode</span>
        </button>
        <button id="open-settings" class="ghost-item">
          <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 8 2.6h.1A1.7 1.7 0 0 0 9.3 1V1a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 16 2.6a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <button id="open-sidebar" class="icon-button mobile-only" title="Open sidebar" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <button id="model-trigger" class="model-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="status-dot" data-state="unknown"></span>
          <span id="model-name">Select model</span>
          <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="model-menu" class="model-menu" role="listbox" hidden>
          <div class="model-search">
            <input id="model-filter" type="search" placeholder="Search models" autocomplete="off">
          </div>
          <div id="model-list" class="model-list" role="options"></div>
        </div>

        <div class="header-actions">
          <button id="web-search-toggle" class="toggle" aria-pressed="false" title="Use Exa web search">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></svg>
            <span>Search</span>
          </button>
        </div>
      </header>

      <div id="connection-banner" class="connection-banner" hidden></div>

      <section id="messages" class="messages" aria-live="polite"></section>
      <div id="scroll-down" class="scroll-down" hidden title="Scroll to bottom">
        <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </div>

      <div class="composer-wrap">
        <form id="composer" class="composer" autocomplete="off">
          <div id="image-previews" class="image-previews" hidden></div>
          <label class="sr-only" for="input">Message</label>
          <textarea id="input" rows="1" placeholder="Type a message…"></textarea>
          <input id="image-input" class="sr-only" type="file" accept="image/jpeg,image/png,image/webp" multiple>
          <div class="composer-footer">
            <button type="button" id="composer-image" class="composer-chip" title="Attach images" aria-label="Attach images" disabled>
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
              <span>Images</span>
            </button>
            <button type="button" id="composer-model" class="composer-chip">
              <svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7Z"/><path d="M12 22V12m9-5-9 5-9-5"/></svg>
              <span id="composer-model-name">Model</span>
            </button>
            <button type="button" id="composer-search" class="composer-chip" aria-pressed="false">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></svg>
              <span>Web search</span>
            </button>
            <span class="composer-hint">Enter to send · Shift+Enter for newline</span>
            <button id="stop" class="send-button stop" type="button" title="Stop" hidden>
              <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
            </button>
            <button id="send" class="send-button" type="submit" title="Send" disabled>
              <svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/></svg>
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <dialog id="settings" class="settings-dialog">
    <form method="dialog">
      <h2>Settings</h2>
      <section>
        <label for="ollama-url">Ollama URL</label>
        <input id="ollama-url" type="url" placeholder="http://127.0.0.1:11434">
      </section>
      <section>
        <label for="system-prompt">System prompt</label>
        <textarea id="system-prompt" rows="4" placeholder="You are a helpful assistant."></textarea>
      </section>
      <div class="settings-grid">
        <section>
          <label for="temperature">Temperature <output id="temperature-output">0.7</output></label>
          <input id="temperature" type="range" min="0" max="2" step="0.05" value="0.7">
        </section>
        <section>
          <label for="top-p">Top P <output id="top-p-output">0.90</output></label>
          <input id="top-p" type="range" min="0" max="1" step="0.01" value="0.9">
        </section>
      </div>
      <p class="settings-note">
        Web search uses Exa’s public <code>https://mcp.exa.ai/mcp</code> endpoint. Set
        <code>EXA_API_KEY</code> on the server if you need authenticated access.
      </p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary-button">Close</button>
      </div>
    </form>
  </dialog>

  <template id="welcome-template">
    <div class="welcome">
      <h1>Hello there</h1>
      <p>Type a message to get started with your local Ollama models.</p>
    </div>
  </template>

  <div id="toast" class="toast" role="status"></div>
  <script src="/assets/markdown.js?v=20260914" defer></script>
  <script src="/assets/app.js?v=20260916" defer></script>
</body>
</html>
